<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>App A - Stock sender</title>
<h1>App A: send a stock change</h1>
<p>Product: cardboard boxes</p>
<form id="form">
  <label>Change <input id="change" type="number" min="-1000" max="1000" step="1" value="10" required></label>
  <label><input id="fail" type="checkbox"> Simulate processing failure</label>
  <button id="send">Send</button>
</form>
<p id="status" role="status"></p>
<script>
const form = document.querySelector('#form');
const status = document.querySelector('#status');
const send = document.querySelector('#send');
form.onsubmit = async event => {
  event.preventDefault();
  send.disabled = true;
  try {
    const response = await fetch('/changes', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({change: Number(document.querySelector('#change').value),
                            fail: document.querySelector('#fail').checked})
    });
    if (!response.ok) throw new Error('Send failed. Check the quantity and App A terminal.');
    const result = await response.json();
    status.textContent = 'Queued: ' + result.id + ' (processing happens separately)';
  } catch (error) { status.textContent = error.message; }
  finally { send.disabled = false; }
};
</script>
</html>
