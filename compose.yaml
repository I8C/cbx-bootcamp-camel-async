name: stock-workshop
services:
  artemis:
    image: apache/activemq-artemis:2.40.0-alpine
    environment:
      ARTEMIS_USER: workshop
      ARTEMIS_PASSWORD: workshop
      ANONYMOUS_LOGIN: "false"
    ports:
      - "127.0.0.1:61616:61616"
      - "127.0.0.1:8161:8161"
    volumes:
      - broker-data:/var/lib/artemis-instance
      - ./infra/broker.xml:/var/lib/artemis-instance/etc-override/broker.xml:ro
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_USER: workshop
      POSTGRES_PASSWORD: workshop
    command: ["postgres", "-c", "max_prepared_transactions=100"]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - database-data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workshop -d b1"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  broker-data:
  database-data:
